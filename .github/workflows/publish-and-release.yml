name: Publish package and create release

on:
  #push:
  #  tags:
  #    - 'v*.*.*'

  # tag pushed in bump-version workflow doesn't trigger push tags event
  # so adding workflow_dispatch to run the publish-and-release workflow
  # explicitly at the end of bump-version
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish and release"
        required: true

jobs:
  publish-npm-package-to-github:
    name: Publish npm package to GitHub Packages
    runs-on: windows-latest
    permissions:
      id-token: write # required for OIDC (https://docs.npmjs.com/trusted-publishers)
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "adopt-hotspot"
          java-version: 11
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
      - name: Update npm # ensure npm 11.5.1 or later is installed (https://docs.npmjs.com/trusted-publishers)
        run: npm install -g npm@latest
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Publish npm package
        run: npm publish --access public

  create-github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: publish-npm-package-to-github
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Create release
        run: gh release create ${{ inputs.version }} --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
